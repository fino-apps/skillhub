openapi: 3.0.3
info:
  title: SkillhubService
  version: 1.0.0
paths:
  /skillhub/v1/directories:select:
    post:
      operationId: SelectLocalDirectory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.SelectLocalDirectoryRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.SelectLocalDirectoryResponse'
  /skillhub/v1/facets:
    get:
      operationId: ListFacets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ListFacetsResponse'
  /skillhub/v1/imports:
    post:
      operationId: ImportSkill
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.ImportSkillRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ImportSkillResponse'
  /skillhub/v1/imports:preview:
    post:
      operationId: PreviewImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.PreviewImportRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.PreviewImportResponse'
  /skillhub/v1/install-commands:generate:
    post:
      operationId: GetInstallCommand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.GetInstallCommandRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetInstallCommandResponse'
  /skillhub/v1/library/backup:
    get:
      operationId: ExportLibrary
      responses:
        "200":
          headers:
            Content-Disposition:
              description: Attachment with the suggested filename.
              schema:
                type: string
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    post:
      operationId: ImportLibrary
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ImportLibraryResponse'
  /skillhub/v1/library/backup:commit:
    post:
      operationId: CommitLibraryImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.CommitLibraryImportRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.CommitLibraryImportResponse'
  /skillhub/v1/library/backup:preview:
    post:
      operationId: PreviewLibraryImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.PreviewLibraryImportResponse'
  /skillhub/v1/projects:scan:
    post:
      operationId: ScanProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.ScanProjectRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ScanProjectResponse'
  /skillhub/v1/skills:
    get:
      operationId: ListSkills
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 240
        - name: source
          in: query
          schema:
            type: string
            maxLength: 120
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
            maxItems: 30
        - name: uncategorized
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
            maxLength: 128
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ListSkillsResponse'
  /skillhub/v1/skills/{skill_id}:
    get:
      operationId: GetSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetSkillResponse'
    delete:
      operationId: DeleteSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: OK
  /skillhub/v1/skills/{skill_id}/metadata:
    put:
      operationId: UpdateSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.UpdateSkillInput'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.UpdateSkillResponse'
  /skillhub/v1/skills/{skill_id}/versions:
    get:
      operationId: ListVersions
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ListVersionsResponse'
    post:
      operationId: CreateVersion
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.VersionInput'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.CreateVersionResponse'
  /skillhub/v1/skills/{skill_id}/versions/{version_id}:
    delete:
      operationId: DeleteVersion
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /skillhub/v1/skills/{skill_id}/versions/{version_id}/archive:
    get:
      operationId: DownloadZip
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          headers:
            Content-Disposition:
              description: Attachment with the suggested filename.
              schema:
                type: string
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /skillhub/v1/skills/{skill_id}/versions/{version_id}/content:
    get:
      operationId: GetVersionContent
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetVersionContentResponse'
  /skillhub/v1/skills/{skill_id}/versions/{version_id}/default:
    put:
      operationId: SetDefaultVersion
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /skillhub/v1/skills/{skill_id}/versions/{version_id}/file:
    get:
      operationId: GetVersionFile
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetVersionFileResponse'
  /skillhub/v1/skills/{skill_id}/versions/{version_id}:export:
    post:
      operationId: ExportVersionToDirectory
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.ExportVersionToDirectoryRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ExportVersionToDirectoryResponse'
  /skillhub/v1/skills/{skill_id}/versions/{version_id}:repair:
    post:
      operationId: RepairVersion
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /skillhub/v1/skills/{skill_id}:merge:
    post:
      operationId: MergeSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.SkillMergeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.VersionMergeSummary'
  /skillhub/v1/skills/{skill_id}:previewMerge:
    post:
      operationId: PreviewSkillMerge
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.PreviewSkillMergeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.VersionMergeSummary'
  /skillhub/v1/skills:batchDelete:
    post:
      operationId: BatchDeleteSkills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.BatchDeleteSkillsRequest'
        required: true
      responses:
        "200":
          description: OK
  /skillhub/v1/skills:compare:
    post:
      operationId: CompareSkills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.CompareSkillsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.CompareSkillsResponse'
  /skillhub/v1/skills:organize:
    patch:
      operationId: BatchUpdateSkillMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.BatchUpdateSkillMetadataRequest'
        required: true
      responses:
        "200":
          description: OK
  /skillhub/v1/uploads:
    post:
      operationId: UploadZip
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.UploadZipResponse'
  /skillhub/v1/uploads/{upload_id}:commit:
    post:
      operationId: CommitUpload
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.CommitUploadRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ImportSkillResponse'
components:
  schemas:
    google.api.HttpBody:
      title: google.api.HttpBody
      type: object
      properties:
        contentType:
          type: string
        data:
          type: string
          format: byte
        extensions:
          type: array
          items:
            type: object
    skillhub.v1.BackupImportChoice:
      title: skillhub.v1.BackupImportChoice
      type: object
      properties:
        action:
          description: add、merge 或 skip。未指定的条目按新增处理。
          type: string
        skillId:
          type: string
        targetSkillId:
          type: string
    skillhub.v1.BackupImportItem:
      title: skillhub.v1.BackupImportItem
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.BackupMergeCandidate'
        exactTargetId:
          type: string
        skill:
          $ref: '#/components/schemas/skillhub.v1.MergeSkillEntry'
    skillhub.v1.BackupMergeCandidate:
      title: skillhub.v1.BackupMergeCandidate
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/skillhub.v1.VersionMergeSummary'
        targetSkillId:
          type: string
    skillhub.v1.BatchDeleteSkillsRequest:
      title: skillhub.v1.BatchDeleteSkillsRequest
      type: object
      properties:
        skillIds:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
      required:
        - skillIds
    skillhub.v1.BatchUpdateSkillMetadataRequest:
      title: skillhub.v1.BatchUpdateSkillMetadataRequest
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.SkillMetadataChange'
          maxItems: 100
      required:
        - changes
    skillhub.v1.CommitLibraryImportRequest:
      title: skillhub.v1.CommitLibraryImportRequest
      type: object
      properties:
        choices:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.BackupImportChoice'
        uploadId:
          type: string
          format: uuid
      required:
        - uploadId
    skillhub.v1.CommitLibraryImportResponse:
      title: skillhub.v1.CommitLibraryImportResponse
      type: object
      properties:
        addedCount:
          type: integer
          format: int32
        mergedCount:
          type: integer
          format: int32
        skippedCount:
          type: integer
          format: int32
        versions:
          $ref: '#/components/schemas/skillhub.v1.VersionMergeSummary'
    skillhub.v1.CommitUploadRequest:
      title: skillhub.v1.CommitUploadRequest
      type: object
      properties:
        makeDefault:
          type: boolean
        skillPaths:
          type: array
          items:
            type: string
          maxItems: 100
        targetSkillId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
      required:
        - uploadId
        - skillPaths
    skillhub.v1.CompareSkillsRequest:
      title: skillhub.v1.CompareSkillsRequest
      type: object
      properties:
        left:
          $ref: '#/components/schemas/skillhub.v1.SkillLocation'
        right:
          $ref: '#/components/schemas/skillhub.v1.SkillLocation'
      required:
        - left
        - right
    skillhub.v1.CompareSkillsResponse:
      title: skillhub.v1.CompareSkillsResponse
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.FileChangeView'
        leftCommitSha:
          type: string
        leftDigest:
          type: string
        rightCommitSha:
          type: string
        rightDigest:
          type: string
    skillhub.v1.CreateVersionRequest:
      title: skillhub.v1.CreateVersionRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
        version:
          $ref: '#/components/schemas/skillhub.v1.VersionInput'
      required:
        - skillId
        - version
    skillhub.v1.CreateVersionResponse:
      title: skillhub.v1.CreateVersionResponse
      type: object
      properties:
        version:
          $ref: '#/components/schemas/skillhub.v1.VersionView'
    skillhub.v1.DeleteSkillRequest:
      title: skillhub.v1.DeleteSkillRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
    skillhub.v1.DeleteVersionRequest:
      title: skillhub.v1.DeleteVersionRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
        - skillId
        - versionId
    skillhub.v1.DownloadZipRequest:
      title: skillhub.v1.DownloadZipRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
        - skillId
        - versionId
    skillhub.v1.DownloadZipResponse:
      title: skillhub.v1.DownloadZipResponse
      type: object
      properties:
        archive:
          $ref: '#/components/schemas/google.api.HttpBody'
        filename:
          type: string
    skillhub.v1.ExportLibraryRequest:
      title: skillhub.v1.ExportLibraryRequest
      type: object
    skillhub.v1.ExportLibraryResponse:
      title: skillhub.v1.ExportLibraryResponse
      type: object
      properties:
        archive:
          $ref: '#/components/schemas/google.api.HttpBody'
        filename:
          type: string
    skillhub.v1.ExportVersionToDirectoryRequest:
      title: skillhub.v1.ExportVersionToDirectoryRequest
      type: object
      properties:
        chooseDirectory:
          type: boolean
        directory:
          type: string
          maxLength: 2048
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
        - skillId
        - versionId
    skillhub.v1.ExportVersionToDirectoryResponse:
      title: skillhub.v1.ExportVersionToDirectoryResponse
      type: object
      properties:
        path:
          type: string
    skillhub.v1.FileChangeKind:
      title: skillhub.v1.FileChangeKind
      type: string
      enum:
        - FILE_CHANGE_KIND_UNSPECIFIED
        - FILE_CHANGE_KIND_ADDED
        - FILE_CHANGE_KIND_MODIFIED
        - FILE_CHANGE_KIND_DELETED
    skillhub.v1.FileChangeView:
      title: skillhub.v1.FileChangeView
      type: object
      properties:
        binary:
          type: boolean
        detail:
          type: string
        kind:
          $ref: '#/components/schemas/skillhub.v1.FileChangeKind'
        leftText:
          type: string
        path:
          type: string
        rightText:
          type: string
    skillhub.v1.GetInstallCommandRequest:
      title: skillhub.v1.GetInstallCommandRequest
      type: object
      properties:
        global:
          type: boolean
        skillId:
          type: string
          format: uuid
          maxLength: 36
        versionId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
        - versionId
    skillhub.v1.GetInstallCommandResponse:
      title: skillhub.v1.GetInstallCommandResponse
      type: object
      properties:
        command:
          type: string
    skillhub.v1.GetSkillRequest:
      title: skillhub.v1.GetSkillRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
    skillhub.v1.GetSkillResponse:
      title: skillhub.v1.GetSkillResponse
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/skillhub.v1.SkillView'
    skillhub.v1.GetVersionContentRequest:
      title: skillhub.v1.GetVersionContentRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
        - skillId
        - versionId
    skillhub.v1.GetVersionContentResponse:
      title: skillhub.v1.GetVersionContentResponse
      type: object
      properties:
        description:
          type: string
        files:
          type: array
          items:
            type: string
    skillhub.v1.GetVersionFileRequest:
      title: skillhub.v1.GetVersionFileRequest
      type: object
      properties:
        path:
          type: string
          maxLength: 2048
        skillId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
      required:
        - skillId
        - versionId
        - path
    skillhub.v1.GetVersionFileResponse:
      title: skillhub.v1.GetVersionFileResponse
      type: object
      properties:
        binary:
          type: boolean
        size:
          type: integer
          format: int32
        text:
          type: string
        tooLarge:
          type: boolean
    skillhub.v1.GitHubSource:
      title: skillhub.v1.GitHubSource
      type: object
      properties:
        ref:
          type: string
        repositoryUrl:
          description: 必须是 GitHub HTTPS 仓库地址。
          type: string
        skillPath:
          description: 空路径表示 Skill 位于仓库根目录。
          type: string
    skillhub.v1.ImportFailure:
      title: skillhub.v1.ImportFailure
      type: object
      properties:
        message:
          type: string
        path:
          type: string
    skillhub.v1.ImportLibraryRequest:
      title: skillhub.v1.ImportLibraryRequest
      type: object
      properties:
        file:
          type: string
          format: byte
    skillhub.v1.ImportLibraryResponse:
      title: skillhub.v1.ImportLibraryResponse
      type: object
      properties:
        addedCount:
          type: integer
          format: int32
        existingCount:
          type: integer
          format: int32
