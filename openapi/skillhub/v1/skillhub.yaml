openapi: 3.0.3
info:
  title: SkillhubService
  version: 1.0.0
paths:
  /skillhub/v1/imports:
    post:
      operationId: ImportSkill
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.ImportSkillRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ImportSkillResponse'
  /skillhub/v1/imports:preview:
    post:
      operationId: PreviewImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.PreviewImportRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.PreviewImportResponse'
  /skillhub/v1/install-commands:generate:
    post:
      operationId: GetInstallCommand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.GetInstallCommandRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetInstallCommandResponse'
  /skillhub/v1/projects:scan:
    post:
      operationId: ScanProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.ScanProjectRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ScanProjectResponse'
  /skillhub/v1/skills:
    get:
      operationId: ListSkills
      parameters:
        - name: category
          in: query
          schema:
            type: string
            maxLength: 128
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ListSkillsResponse'
  /skillhub/v1/skills/{skill_id}:
    get:
      operationId: GetSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.GetSkillResponse'
    delete:
      operationId: DeleteSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: OK
  /skillhub/v1/skills/{skill_id}/metadata:
    put:
      operationId: UpdateSkill
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.UpdateSkillInput'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.UpdateSkillResponse'
  /skillhub/v1/skills/{skill_id}/versions:
    get:
      operationId: ListVersions
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: pageToken
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.ListVersionsResponse'
    post:
      operationId: CreateVersion
      parameters:
        - name: skill_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.VersionInput'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.CreateVersionResponse'
  /skillhub/v1/skills:compare:
    post:
      operationId: CompareSkills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skillhub.v1.CompareSkillsRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skillhub.v1.CompareSkillsResponse'
components:
  schemas:
    skillhub.v1.CompareSkillsRequest:
      title: skillhub.v1.CompareSkillsRequest
      type: object
      properties:
        left:
          $ref: '#/components/schemas/skillhub.v1.SkillLocation'
        right:
          $ref: '#/components/schemas/skillhub.v1.SkillLocation'
      required:
        - left
        - right
    skillhub.v1.CompareSkillsResponse:
      title: skillhub.v1.CompareSkillsResponse
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.FileChangeView'
        leftCommitSha:
          type: string
        leftDigest:
          type: string
        rightCommitSha:
          type: string
        rightDigest:
          type: string
    skillhub.v1.CreateVersionRequest:
      title: skillhub.v1.CreateVersionRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
        version:
          $ref: '#/components/schemas/skillhub.v1.VersionInput'
      required:
        - skillId
        - version
    skillhub.v1.CreateVersionResponse:
      title: skillhub.v1.CreateVersionResponse
      type: object
      properties:
        version:
          $ref: '#/components/schemas/skillhub.v1.VersionView'
    skillhub.v1.DeleteSkillRequest:
      title: skillhub.v1.DeleteSkillRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
    skillhub.v1.FileChangeKind:
      title: skillhub.v1.FileChangeKind
      type: string
      enum:
        - FILE_CHANGE_KIND_UNSPECIFIED
        - FILE_CHANGE_KIND_ADDED
        - FILE_CHANGE_KIND_MODIFIED
        - FILE_CHANGE_KIND_DELETED
    skillhub.v1.FileChangeView:
      title: skillhub.v1.FileChangeView
      type: object
      properties:
        binary:
          type: boolean
        kind:
          $ref: '#/components/schemas/skillhub.v1.FileChangeKind'
        leftText:
          type: string
        path:
          type: string
        rightText:
          type: string
    skillhub.v1.GetInstallCommandRequest:
      title: skillhub.v1.GetInstallCommandRequest
      type: object
      properties:
        global:
          type: boolean
        skillId:
          type: string
          format: uuid
          maxLength: 36
        versionId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
        - versionId
    skillhub.v1.GetInstallCommandResponse:
      title: skillhub.v1.GetInstallCommandResponse
      type: object
      properties:
        command:
          type: string
    skillhub.v1.GetSkillRequest:
      title: skillhub.v1.GetSkillRequest
      type: object
      properties:
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
    skillhub.v1.GetSkillResponse:
      title: skillhub.v1.GetSkillResponse
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/skillhub.v1.SkillView'
    skillhub.v1.GitHubSource:
      title: skillhub.v1.GitHubSource
      type: object
      properties:
        ref:
          type: string
        repositoryUrl:
          description: 必须是 GitHub HTTPS 仓库地址。
          type: string
        skillPath:
          description: 空路径表示 Skill 位于仓库根目录。
          type: string
    skillhub.v1.ImportSkillRequest:
      title: skillhub.v1.ImportSkillRequest
      type: object
      properties:
        commitSha:
          type: string
          minLength: 40
          maxLength: 40
        repositoryUrl:
          description: 本地收录时仓库字段留空，skill_paths 为本机绝对路径。
          type: string
          maxLength: 2048
        skillPaths:
          type: array
          items:
            type: string
          maxItems: 100
        sourceRef:
          type: string
          maxLength: 200
      required:
        - skillPaths
    skillhub.v1.ImportSkillResponse:
      title: skillhub.v1.ImportSkillResponse
      type: object
      properties:
        addedCount:
          type: integer
          format: int32
        existingCount:
          type: integer
          format: int32
    skillhub.v1.ListSkillsRequest:
      title: skillhub.v1.ListSkillsRequest
      type: object
      properties:
        category:
          type: string
          maxLength: 128
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        pageToken:
          type: string
          maxLength: 512
    skillhub.v1.ListSkillsResponse:
      title: skillhub.v1.ListSkillsResponse
      type: object
      properties:
        nextPageToken:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.SkillView'
    skillhub.v1.ListVersionsRequest:
      title: skillhub.v1.ListVersionsRequest
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        pageToken:
          type: string
          maxLength: 512
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
    skillhub.v1.ListVersionsResponse:
      title: skillhub.v1.ListVersionsResponse
      type: object
      properties:
        nextPageToken:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.VersionView'
    skillhub.v1.PreviewImportRequest:
      title: skillhub.v1.PreviewImportRequest
      type: object
      properties:
        scanCollection:
          description: 扫描仓库的 skills/ 集合。
          type: boolean
        source:
          $ref: '#/components/schemas/skillhub.v1.GitHubSource'
      required:
        - source
    skillhub.v1.PreviewImportResponse:
      title: skillhub.v1.PreviewImportResponse
      type: object
      properties:
        resolvedCommitSha:
          type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.SkillCandidate'
    skillhub.v1.ScanProjectRequest:
      title: skillhub.v1.ScanProjectRequest
      type: object
      properties:
        projectPath:
          type: string
          maxLength: 2048
      required:
        - projectPath
    skillhub.v1.ScanProjectResponse:
      title: skillhub.v1.ScanProjectResponse
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/skillhub.v1.SkillCandidate'
    skillhub.v1.SkillCandidate:
      title: skillhub.v1.SkillCandidate
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        path:
          type: string
    skillhub.v1.SkillLocation:
      title: skillhub.v1.SkillLocation
      description: SkillLocation 选择最近收录版本、指定版本、本机目录或 GitHub 来源。
      type: object
      properties:
        currentSkillId:
          description: 应用层校验恰好指定一种来源。
          type: string
        github:
          $ref: '#/components/schemas/skillhub.v1.GitHubSource'
        localPath:
          type: string
        versionId:
          type: string
    skillhub.v1.SkillView:
      title: skillhub.v1.SkillView
      type: object
      properties:
        category:
          type: string
        createTime:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        localPath:
          type: string
        name:
          type: string
        notes:
          type: string
        repositoryPath:
          type: string
        repositoryUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        updateTime:
          type: string
          format: date-time
    skillhub.v1.UpdateSkillInput:
      title: skillhub.v1.UpdateSkillInput
      description: 替换本地分类、备注和标签。
      type: object
      properties:
        category:
          type: string
          maxLength: 128
        notes:
          type: string
          maxLength: 4096
        tags:
          type: array
          items:
            type: string
          maxItems: 100
    skillhub.v1.UpdateSkillRequest:
      title: skillhub.v1.UpdateSkillRequest
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/skillhub.v1.UpdateSkillInput'
        skillId:
          type: string
          format: uuid
          maxLength: 36
      required:
        - skillId
        - skill
    skillhub.v1.UpdateSkillResponse:
      title: skillhub.v1.UpdateSkillResponse
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/skillhub.v1.SkillView'
    skillhub.v1.VersionInput:
      title: skillhub.v1.VersionInput
      type: object
      properties:
        commitSha:
          type: string
          minLength: 40
          maxLength: 40
        expectedDigest:
          description: 本地版本要匹配比对时的原目录摘要。
          type: string
          minLength: 64
          maxLength: 64
        notes:
          type: string
          maxLength: 4096
        sourceRef:
          type: string
          maxLength: 200
    skillhub.v1.VersionView:
      title: skillhub.v1.VersionView
      type: object
      properties:
        commitSha:
          type: string
        contentDigest:
          type: string
        createTime:
          type: string
          format: date-time
        id:
          type: string
        name:
          type: string
        notes:
          type: string
        skillId:
          type: string
        sourceRef:
          type: string
