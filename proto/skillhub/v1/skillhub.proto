syntax = "proto3";

package skillhub.v1;

import "fino/core/null.proto";
import "fino/core/time.proto";
import "fino/options.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";

option go_package = "github.com/fino-io/skillhub/go/skillhub/v1;skillhub";

service SkillhubService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {get: "/skillhub/v1/skills"};
  }

  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse) {
    option (google.api.http) = {get: "/skillhub/v1/skills/{skill_id}"};
  }

  rpc UpdateSkill(UpdateSkillRequest) returns (UpdateSkillResponse) {
    option (google.api.http) = {put: "/skillhub/v1/skills/{skill_id}/metadata" body: "skill"};
  }

  rpc DeleteSkill(DeleteSkillRequest) returns (fino.core.Null) {
    option (google.api.http) = {delete: "/skillhub/v1/skills/{skill_id}"};
  }

  rpc BatchDeleteSkills(BatchDeleteSkillsRequest) returns (fino.core.Null) {
    option (google.api.http) = {post: "/skillhub/v1/skills:batchDelete" body: "*"};
  }

  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {
    option (google.api.http) = {get: "/skillhub/v1/skills/{skill_id}/versions"};
  }

  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse) {
    option (google.api.http) = {post: "/skillhub/v1/skills/{skill_id}/versions" body: "version"};
  }

  rpc ScanProject(ScanProjectRequest) returns (ScanProjectResponse) {
    option (google.api.http) = {post: "/skillhub/v1/projects:scan" body: "*"};
  }

  rpc PreviewImport(PreviewImportRequest) returns (PreviewImportResponse) {
    option (google.api.http) = {post: "/skillhub/v1/imports:preview" body: "*"};
  }

  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse) {
    option (google.api.http) = {post: "/skillhub/v1/imports" body: "*"};
  }

  rpc SetDefaultVersion(SetDefaultVersionRequest) returns (fino.core.Null) {
    option (google.api.http) = {put: "/skillhub/v1/skills/{skill_id}/versions/{version_id}/default"};
  }

  rpc DeleteVersion(DeleteVersionRequest) returns (fino.core.Null) {
    option (google.api.http) = {delete: "/skillhub/v1/skills/{skill_id}/versions/{version_id}"};
  }

  rpc GetVersionContent(GetVersionContentRequest) returns (GetVersionContentResponse) {
    option (google.api.http) = {get: "/skillhub/v1/skills/{skill_id}/versions/{version_id}/content"};
  }

  rpc GetVersionFile(GetVersionFileRequest) returns (GetVersionFileResponse) {
    option (google.api.http) = {get: "/skillhub/v1/skills/{skill_id}/versions/{version_id}/file"};
  }

  rpc DownloadZip(DownloadZipRequest) returns (DownloadZipResponse) {
    option (google.api.http) = {
      get: "/skillhub/v1/skills/{skill_id}/versions/{version_id}/archive"
      response_body: "archive"
    };
    option (fino.http) = {attachment_filename_field: "filename"};
  }

  rpc SelectLocalDirectory(SelectLocalDirectoryRequest) returns (SelectLocalDirectoryResponse) {
    option (google.api.http) = {post: "/skillhub/v1/directories:select" body: "*"};
  }

  rpc ExportVersionToDirectory(ExportVersionToDirectoryRequest) returns (ExportVersionToDirectoryResponse) {
    option (google.api.http) = {post: "/skillhub/v1/skills/{skill_id}/versions/{version_id}:export" body: "*"};
  }

  rpc RepairVersion(RepairVersionRequest) returns (fino.core.Null) {
    option (google.api.http) = {post: "/skillhub/v1/skills/{skill_id}/versions/{version_id}:repair"};
  }

  rpc ListFacets(ListFacetsRequest) returns (ListFacetsResponse) {
    option (google.api.http) = {get: "/skillhub/v1/facets"};
  }

  rpc BatchUpdateSkillMetadata(BatchUpdateSkillMetadataRequest) returns (fino.core.Null) {
    option (google.api.http) = {patch: "/skillhub/v1/skills:organize" body: "*"};
  }

  rpc UploadZip(UploadZipRequest) returns (UploadZipResponse) {
    option (google.api.http) = {post: "/skillhub/v1/uploads" body: "file"};
    option (fino.http) = {multipart: {max_file_bytes: 67108864}};
  }

  rpc CommitUpload(CommitUploadRequest) returns (ImportSkillResponse) {
    option (google.api.http) = {post: "/skillhub/v1/uploads/{upload_id}:commit" body: "*"};
  }

  rpc CompareSkills(CompareSkillsRequest) returns (CompareSkillsResponse) {
    option (google.api.http) = {post: "/skillhub/v1/skills:compare" body: "*"};
  }

  rpc GetInstallCommand(GetInstallCommandRequest) returns (GetInstallCommandResponse) {
    option (google.api.http) = {post: "/skillhub/v1/install-commands:generate" body: "*"};
  }

  rpc ExportLibrary(ExportLibraryRequest) returns (ExportLibraryResponse) {
    option (google.api.http) = {
      get: "/skillhub/v1/library/backup"
      response_body: "archive"
    };
    option (fino.http) = {attachment_filename_field: "filename"};
  }

  rpc ImportLibrary(ImportLibraryRequest) returns (ImportLibraryResponse) {
    option (google.api.http) = {post: "/skillhub/v1/library/backup" body: "file"};
    option (fino.http) = {multipart: {max_file_bytes: 268435456}};
  }

  rpc PreviewLibraryImport(PreviewLibraryImportRequest) returns (PreviewLibraryImportResponse) {
    option (google.api.http) = {post: "/skillhub/v1/library/backup:preview" body: "file"};
    option (fino.http) = {multipart: {max_file_bytes: 268435456}};
  }

  rpc CommitLibraryImport(CommitLibraryImportRequest) returns (CommitLibraryImportResponse) {
    option (google.api.http) = {post: "/skillhub/v1/library/backup:commit" body: "*"};
  }

  rpc PreviewSkillMerge(PreviewSkillMergeRequest) returns (VersionMergeSummary) {
    option (google.api.http) = {post: "/skillhub/v1/skills/{skill_id}:previewMerge" body: "*"};
  }

  rpc MergeSkill(SkillMergeRequest) returns (VersionMergeSummary) {
    option (google.api.http) = {post: "/skillhub/v1/skills/{skill_id}:merge" body: "*"};
  }
}

message ListSkillsRequest {
  string keyword = 1 [(fino.validate) = {omitempty: true max: 240}];
  string source = 2 [(fino.validate) = {omitempty: true max: 120}];
  repeated string tags = 4 [(fino.validate) = {omitempty: true max: 30}];
  bool uncategorized = 5;
  string category = 3 [(fino.validate) = {omitempty: true max: 128}];

  int32 page_size = 90 [(fino.validate) = {omitempty: true min: 1 max: 100}];
  string page_token = 91 [(fino.validate) = {omitempty: true max: 512}];
}

message ListSkillsResponse {
  repeated SkillView skills = 1;
  string next_page_token = 93;
}

message SkillView {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 5;
  repeated string tags = 6;
  string notes = 7;
  string repository_url = 8;
  string repository_path = 9;
  string local_path = 10;
  string import_kind = 11;
  string purpose = 12;
  string upstream_name = 13;
  string upstream_url = 14;
  VersionView default_version = 15;

  fino.core.Timestamp create_time = 98;
  fino.core.Timestamp update_time = 99;
}

message GetSkillRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
}

message GetSkillResponse {
  SkillView skill = 1;
}

message UpdateSkillRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
  UpdateSkillInput skill = 2 [(fino.validate) = {required: true}];
}

// 替换本地分类、备注和标签。
message UpdateSkillInput {
  string category = 3 [(fino.validate) = {omitempty: true max: 128}];
  repeated string tags = 4 [(fino.validate) = {omitempty: true max: 100}];
  string notes = 5 [(fino.validate) = {omitempty: true max: 4096}];
  string purpose = 6 [(fino.validate) = {omitempty: true max: 240}];
  string upstream_name = 7 [(fino.validate) = {omitempty: true max: 120}];
  string upstream_url = 8 [(fino.validate) = {omitempty: true max: 2048}];
}

message UpdateSkillResponse {
  SkillView skill = 1;
}

message DeleteSkillRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
}

message BatchDeleteSkillsRequest {
  repeated string skill_ids = 1 [(fino.validate) = {required: true min: 1 max: 100}];
}

message ListVersionsRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];

  int32 page_size = 90 [(fino.validate) = {omitempty: true min: 1 max: 100}];
  string page_token = 91 [(fino.validate) = {omitempty: true max: 512}];
}

message VersionView {
  string id = 1;
  string skill_id = 2;
  string name = 3;
  string notes = 4;
  string source_ref = 6;
  string commit_sha = 7;
  string content_digest = 8;
  bool available = 9;
  string upstream_commit = 10;
  string upstream_repository = 11;
  string upstream_path = 12;

  fino.core.Timestamp create_time = 98;
}

message ListVersionsResponse {
  repeated VersionView versions = 1;
  string next_page_token = 93;
}

message VersionInput {
  string source_ref = 1 [(fino.validate) = {omitempty: true max: 200}];
  string commit_sha = 2 [(fino.validate) = {omitempty: true min: 40 max: 40}];
  string notes = 3 [(fino.validate) = {omitempty: true max: 4096}];
  // 本地版本要匹配比对时的原目录摘要。
  string expected_digest = 4 [(fino.validate) = {omitempty: true min: 64 max: 64}];
  string local_path = 5 [(fino.validate) = {omitempty: true max: 2048}];
  bool make_default = 6;
}

message CreateVersionRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
  VersionInput version = 2 [(fino.validate) = {required: true}];
}

message CreateVersionResponse {
  VersionView version = 1;
}

// SkillLocation 选择最近收录版本、指定版本、本机目录或 GitHub 来源。
message SkillLocation {
  // 应用层校验恰好指定一种来源。
  string current_skill_id = 1;
  string version_id = 2;
  string local_path = 3;
  GitHubSource github = 4;
}

message GitHubSource {
  // 必须是 GitHub HTTPS 仓库地址。
  string repository_url = 1;
  // 空路径表示 Skill 位于仓库根目录。
  string skill_path = 2;
  string ref = 3;
}

message ScanProjectRequest {
  string project_path = 1 [(fino.validate) = {required: true max: 2048}];
}
message SkillCandidate {
  string path = 1;
  string name = 2;
  string description = 3;
}

message ScanProjectResponse {
  repeated SkillCandidate skills = 1;
}

message PreviewImportRequest {
  GitHubSource source = 1 [(fino.validate) = {required: true}];
  // 扫描仓库的 skills/ 集合。
  bool scan_collection = 2;
}

message PreviewImportResponse {
  string resolved_commit_sha = 1;
  repeated SkillCandidate skills = 2;
}

message ImportSkillRequest {
  // 本地收录时仓库字段留空，skill_paths 为本机绝对路径。
  string repository_url = 1 [(fino.validate) = {omitempty: true max: 2048}];
  string source_ref = 2 [(fino.validate) = {omitempty: true max: 200}];
  string commit_sha = 3 [(fino.validate) = {omitempty: true min: 40 max: 40}];
  repeated string skill_paths = 4 [(fino.validate) = {required: true max: 100}];
  // 分类和标签仅应用到本批新收录的 Skill。
  string category = 5 [(fino.validate) = {omitempty: true max: 128}];
  repeated string tags = 6 [(fino.validate) = {omitempty: true max: 100}];
}

message ImportFailure {
  string path = 1;
  string message = 2;
}

message ImportSkillResponse {
  int32 added_count = 1;
  int32 existing_count = 2;
  repeated ImportFailure failures = 3;
}

message CompareSkillsRequest {
  SkillLocation left = 1 [(fino.validate) = {required: true}];
  SkillLocation right = 2 [(fino.validate) = {required: true}];
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_MODIFIED = 2;
  FILE_CHANGE_KIND_DELETED = 3;
}

message FileChangeView {
  string path = 1;
  FileChangeKind kind = 2;
  bool binary = 3;
  string left_text = 4;
  string right_text = 5;
  string detail = 6;
}

message CompareSkillsResponse {
  repeated FileChangeView files = 1;
  string left_digest = 2;
  string right_digest = 3;
  string left_commit_sha = 4;
  string right_commit_sha = 5;
}

message GetInstallCommandRequest {
  string skill_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true max: 36 uuid: true}];
  bool global = 3;
}

message GetInstallCommandResponse {
  string command = 1;
}

message SetDefaultVersionRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
}

message DeleteVersionRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
}

message GetVersionContentRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
}

message GetVersionContentResponse {
  string description = 1;
  repeated string files = 2;
}

message GetVersionFileRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
  string path = 3 [(fino.validate) = {required: true max: 2048}];
}

message GetVersionFileResponse {
  string text = 1;
  int32 size = 2;
  bool binary = 3;
  bool too_large = 4;
}

message SelectLocalDirectoryRequest {}
message SelectLocalDirectoryResponse {
  string path = 1;
}

message ExportVersionToDirectoryRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
  string directory = 3 [(fino.validate) = {omitempty: true max: 2048}];
  bool choose_directory = 4;
}

message ExportVersionToDirectoryResponse {
  string path = 1;
}

message RepairVersionRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
}

message ListFacetsRequest {}

message ListFacetsResponse {
  repeated string categories = 1;
  repeated string sources = 2;
  repeated string tags = 3;
}

message SkillMetadataChange {
  string skill_id = 1;
  optional string purpose = 2;
  optional string category = 3;
  repeated string add_tags = 4;
  repeated string remove_tags = 5;
  string revision = 6;
}

message BatchUpdateSkillMetadataRequest {
  repeated SkillMetadataChange changes = 1 [(fino.validate) = {required: true max: 100}];
}

message DownloadZipRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string version_id = 2 [(fino.validate) = {required: true uuid: true}];
  bool include_root_directory = 3;
}

message DownloadZipResponse {
  google.api.HttpBody archive = 1;
  string filename = 2;
}

message UploadZipRequest {
  bytes file = 1;
}

message UploadZipResponse {
  string upload_id = 1;
  repeated SkillCandidate skills = 2;
}

message CommitUploadRequest {
  string upload_id = 1 [(fino.validate) = {required: true uuid: true}];
  repeated string skill_paths = 2 [(fino.validate) = {required: true max: 100}];
  string target_skill_id = 3 [(fino.validate) = {omitempty: true uuid: true}];
  bool make_default = 4;
}

message ExportLibraryRequest {}

message ExportLibraryResponse {
  google.api.HttpBody archive = 1;
  string filename = 2;
}

message ImportLibraryRequest {
  bytes file = 1;
}

message ImportLibraryResponse {
  int32 added_count = 1;
  int32 existing_count = 2;
}

message PreviewLibraryImportRequest {
  bytes file = 1;
}

message MergeSkillEntry {
  string id = 1;
  string name = 2;
  string source = 3;
  int32 version_count = 4;
  string default_version = 5;
}

message VersionMergeSummary {
  int32 added_versions = 1;
  int32 restored_snapshots = 2;
  int32 skipped_versions = 3;
  string revision = 4;
  repeated VersionMergeChange changes = 5;
}

message VersionMergeChange {
  string version_id = 1;
  string commit_sha = 2;
  string content_digest = 3;
  string notes = 4;
  string source = 5;
  string action = 6;
  repeated string restored_version_ids = 7;
}

message BackupMergeCandidate {
  string target_skill_id = 1;
  VersionMergeSummary summary = 2;
}

message BackupImportItem {
  MergeSkillEntry skill = 1;
  repeated BackupMergeCandidate candidates = 2;
  string exact_target_id = 3;
}

message PreviewLibraryImportResponse {
  string upload_id = 1;
  repeated BackupImportItem items = 2;
  repeated MergeSkillEntry targets = 3;
}

message BackupImportChoice {
  string skill_id = 1;
  // add、merge 或 skip。未指定的条目按新增处理。
  string action = 2;
  string target_skill_id = 3;
}

message CommitLibraryImportRequest {
  string upload_id = 1 [(fino.validate) = {required: true uuid: true}];
  repeated BackupImportChoice choices = 2;
}

message CommitLibraryImportResponse {
  int32 added_count = 1;
  int32 merged_count = 2;
  int32 skipped_count = 3;
  VersionMergeSummary versions = 4;
}

message PreviewSkillMergeRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string target_skill_id = 2 [(fino.validate) = {required: true uuid: true}];
  // 指定暂存备份时，skill_id 为备份中的条目。
  string backup_upload_id = 3 [(fino.validate) = {omitempty: true uuid: true}];
}

message SkillMergeRequest {
  string skill_id = 1 [(fino.validate) = {required: true uuid: true}];
  string target_skill_id = 2 [(fino.validate) = {required: true uuid: true}];
  string revision = 3 [(fino.validate) = {required: true min: 64 max: 64}];
}
