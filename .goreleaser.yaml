version: 2

dist: .fino/release

project_name: skillhub

release:
  disable: true

before:
  hooks:
    - sh -c "cd backend && go mod tidy"
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: skillhub-server
    dir: backend
    main: ./cmd/skillhub-server
    binary: skillhub-server
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -linkmode external -extldflags -static -X main.gitHash={{ .ShortCommit }} -X main.gitBranch={{ .Branch }} -X main.buildTime={{ .Date }}

archives:
  - id: backend
    ids:
      - skillhub-server
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: deployment
    meta: true
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_deployment"
    files:
      - deploy/**/*
      - backend/configs/*.yaml

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: skillhub-server
    ids:
      - skillhub-server
    dockerfile: backend/build/skillhub-server/Dockerfile
    images:
      - 100.118.125.84:5000/skillhub/skillhub-server
    tags:
      - "{{ .Tag }}"
      - "{{ if .IsSnapshot }}latest{{ else }}latest-amd64{{ end }}"
    platforms:
      - linux/amd64
    sbom: false
    labels:
      org.opencontainers.image.title: skillhub-server
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.ref.name: "{{ .Branch }}"

  - id: skillhub-frontend
    dockerfile: frontend/Dockerfile
    extra_files:
      - frontend/Caddyfile
      - .fino/frontend
    images:
      - 100.118.125.84:5000/skillhub/skillhub-frontend
    tags:
      - "{{ .Tag }}"
      - "{{ if .IsSnapshot }}latest{{ else }}latest-amd64{{ end }}"
    platforms:
      - linux/amd64
    sbom: false
    labels:
      org.opencontainers.image.title: skillhub-frontend
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.ref.name: "{{ .Branch }}"
