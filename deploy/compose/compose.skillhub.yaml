# SkillHub runtime settings layered over the Fino-generated compose.yaml.
services:
  skillhub-server:
    ports: !reset []
    environment:
      SERVER_HTTP_HOST: 0.0.0.0
      SKILLHUB_DATA_DIR: /app/data
      SKILLHUB_EXPORT_DIR: /app/data/exports
    volumes:
      - skillhub_data:/app/data
    entrypoint: ["/app/bin/main"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SERVER_HTTP_PORT}/readyz"]

  frontend:
    ports: !override
      - "127.0.0.1:${SKILLHUB_FRONTEND_PORT}:80"

volumes:
  skillhub_data:
