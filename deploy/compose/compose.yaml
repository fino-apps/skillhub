name: skillhub
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  skillhub-server:
    container_name: "skillhub-server"
    image: "${IMAGE_REPOSITORY}/${SKILLHUB_SERVER_IMAGE}"
    restart: unless-stopped
    logging: *default-logging
    labels:
      fino.logs: "true"
    networks:
      - infra
    volumes:
      - ./bootstrap/skillhub-server:/app/bootstrap
      - ../../backend/configs:/app/configs:ro
      - skillhub_data:/app/skillhub-data
    environment:
      TZ: Asia/Shanghai
      SERVER_HTTP_PORT: "${SERVER_HTTP_PORT}"
      SERVER_GRPC_PORT: "${SERVER_GRPC_PORT}"
      SERVER_DEBUG_PORT: "${SERVER_DEBUG_PORT}"
      PAGINATION_ENCODED_KEY: "${PAGINATION_ENCODED_KEY}"
      SKILLHUB_URL: "${SKILLHUB_URL:-}"
      OTEL_ENDPOINT: "alloy:4318"
    entrypoint: [ "sh", "/app/bootstrap/entrypoint.sh" ]
    healthcheck:
      test: [ "CMD", "sh", "/app/bootstrap/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    container_name: "skillhub-frontend"
    image: "${IMAGE_REPOSITORY}/${SKILLHUB_FRONTEND_IMAGE}"
    restart: always
    logging: *default-logging
    labels:
      fino.logs: "true"
    networks:
      - infra
    ports:
      - "${SKILLHUB_FRONTEND_BIND:-127.0.0.1}:${SKILLHUB_FRONTEND_PORT}:80"
    volumes:
      - ./bootstrap/caddy:/bootstrap:ro
      - caddy_data:/data
    environment:
      APP_HOST: "${SKILLHUB_APP_HOST:-skillhub-server}"
      APP_PORT: "${SERVER_HTTP_PORT}"
      API_PREFIX: "${SKILLHUB_API_PREFIX:-/skillhub/v1}"
    entrypoint: [ "sh", "/bootstrap/entrypoint.sh" ]
    healthcheck:
      test: [ "CMD", "sh", "/bootstrap/healthcheck.sh" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  infra:
    external: true

volumes:
  caddy_data:
  skillhub_data:
